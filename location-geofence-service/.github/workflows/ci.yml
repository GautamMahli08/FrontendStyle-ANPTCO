name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Unit tests ───────────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: location-geofence-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: location-geofence-service/go.sum

      - name: go vet
        run: go vet ./...

      - name: Unit tests (race detector)
        run: go test ./... -count=1 -race -timeout 60s

  # ── Integration tests ────────────────────────────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: location-geofence-service
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: geofence
          POSTGRES_PASSWORD: geofence
          POSTGRES_DB: geofence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geofence -d geofence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: location-geofence-service/go.sum

      - name: Integration tests
        env:
          INTEGRATION_DATABASE_URL: postgres://geofence:geofence@localhost:5432/geofence_test?sslmode=disable
          MIGRATIONS_DIR: migrations
        run: go test ./test/integration/... -v -count=1 -timeout 120s

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build Lambda binary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: location-geofence-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: location-geofence-service/go.sum

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o bootstrap ./cmd/lambda

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap
          path: location-geofence-service/bootstrap
          retention-days: 3

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest
    needs: [unit, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: location-geofence-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: location-geofence-service/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-south-1

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o bootstrap ./cmd/lambda
          zip ingest.zip bootstrap

      - name: Deploy
        run: |
          aws lambda update-function-code \
            --function-name location-geofence-service-IngestFunction-vuduEjK6zqVS \
            --zip-file fileb://ingest.zip
