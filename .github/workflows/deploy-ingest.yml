name: Deploy Ingest Service

on:
  push:
    branches: [main]
    paths:
      - 'location-geofence-service/**'

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: location-geofence-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: location-geofence-service/go.sum
      - run: go vet ./...
      - run: go test ./... -count=1 -race -timeout 60s

  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: location-geofence-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: location-geofence-service/go.sum
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-south-1
      - name: Build & Deploy
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o bootstrap ./cmd/lambda
          zip ingest.zip bootstrap
          aws lambda update-function-code \
            --function-name location-geofence-service-IngestFunction-vuduEjK6zqVS \
            --zip-file fileb://ingest.zip
