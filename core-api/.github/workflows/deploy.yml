name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-south-1

      - name: Build CoreFunction
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o bootstrap ./cmd/lambda/
          zip core-api.zip bootstrap

      - name: Deploy CoreFunction
        run: |
          aws lambda update-function-code \
            --function-name anptco-core-api-CoreFunction-x8i7EMO5kvQ0 \
            --zip-file fileb://core-api.zip

      - name: Build SignupFunction
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o bootstrap ./cmd/signup/
          zip signup.zip bootstrap

      - name: Deploy SignupFunction
        run: |
          aws lambda update-function-code \
            --function-name anptco-core-api-SignupFunction-ZwbhVXvRGpLq \
            --zip-file fileb://signup.zip
